# Profile bundle layer: insert this plugin into whatever profile selects the bundle.
# Selecting the bundle is the opt-in act; the row is active once selected.
- insert:
    - id: tts-chat-answer
      name: 'dsh-tts-chat-answer'
      disabled: false
      config:
        enabled: false
        outputDir: '~/.local/share/dsh-tts-chat-answer'
        groupByWorkspace: true
        engine: 'edge'
        playMode: 'inline'
        voice: 'en-US-AriaNeural'
        fallbackVoice: 'en-US-GuyNeural'
        rate: '+10%'
        volume: '+0%'
        pitch: '+0Hz'
        minChars: 40
        maxChars: 12000
        chunkChars: 1200
        concurrency: 2
        timeoutMs: 600000
        includeSubagents: false
        includeIncomplete: false
        keepTranscript: true
        redactSecrets: true
